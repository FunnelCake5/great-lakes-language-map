<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E6DCC6" />
    <meta name="description" content="An animated atlas of the Algonquian and Siouan language families across the Great Lakes and Midwest, 900 CE to today." />
    <title>Great Lakes Language Map</title>
  </head>
  <body>
    <main id="app">
      <header class="cartouche">
        <h1>The Great Lakes &amp; the Midwest</h1>
        <p>Algonquian and Siouan peoples and languages, 900&nbsp;CE to today</p>
      </header>
      <div id="map" class="map" role="img" aria-label="Map of the Great Lakes and Midwest">
        <canvas id="basemap"></canvas>
        <canvas id="fields"></canvas>
        <svg id="labels" aria-hidden="true"></svg>
        <canvas id="overlays"></canvas>
        <canvas id="nations"></canvas>
        <canvas id="events"></canvas>
        <svg id="nation-labels" aria-hidden="true"><g></g></svg>
        <svg id="driver-labels" aria-hidden="true"><g class="overlay-labels"></g><g class="event-labels"></g></svg>
        <div id="today-note" class="placeholder-note" hidden>
          <strong>Today</strong>
          Present-day nations and place names are roadmap phase 7. They will appear here once each has a source.
        </div>
        <div id="readout" class="readout" aria-live="polite"></div>
        <aside id="key" class="key" aria-label="Map key"></aside>
        <p id="status" class="status" role="status">Drawing the map…</p>
      </div>
      <section id="timebar" class="timebar" aria-label="Time controls"></section>
      <footer class="colophon">
        <span id="counts"></span>
        <span>Basemap: <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a> (public domain) · Albers equal-area conic</span>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
